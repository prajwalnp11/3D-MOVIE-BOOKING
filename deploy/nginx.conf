# Nginx configuration for 3D Movie Booking App
# Place this in /etc/nginx/sites-available/cinema
# Then symlink: ln -s /etc/nginx/sites-available/cinema /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com your-server-ip;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static files served directly by Nginx (fastest performance)
    location /static/ {
        alias /home/ubuntu/3d-movie-booking/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media files (movie posters, uploads)
    location /media/ {
        alias /home/ubuntu/3d-movie-booking/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pass all other requests to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
